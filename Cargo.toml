[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/domain",
    "crates/providers",
    "crates/storage",
    "crates/orchestrator",
    "apps/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/teamwork-ai"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
rand = "0.8"
toml = "0.8"

teamwork-protocol = { path = "crates/protocol" }
teamwork-domain = { path = "crates/domain" }
teamwork-providers = { path = "crates/providers" }
teamwork-storage = { path = "crates/storage" }
teamwork-orchestrator = { path = "crates/orchestrator" }

[profile.release]
lto = "thin"
strip = true
